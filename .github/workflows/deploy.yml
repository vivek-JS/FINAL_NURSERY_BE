name: Deploy to DigitalOcean

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to DigitalOcean
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DROPLET_IP }}
        username: ${{ secrets.DROPLET_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/FINAL_NURSERY_BE
          git fetch origin
          git checkout prod
          git pull origin prod
          mkdir -p /var/www/erp-whatsapp/.wwebjs_auth
          grep -q '^NODE_ENV=' .env || echo 'NODE_ENV=production' >> .env
          grep -q '^WHATSAPP_SESSION_PATH=' .env || echo 'WHATSAPP_SESSION_PATH=/var/www/erp-whatsapp/.wwebjs_auth' >> .env
          npm install --production
          pm2 reload ecosystem.config.cjs --only erp-backend --update-env || pm2 start ecosystem.config.cjs --only erp-backend --update-env
          pm2 save

