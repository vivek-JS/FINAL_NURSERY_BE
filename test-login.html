<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Login API Test</h1>
    
    <div class="form-group">
        <label for="phoneNumber">Phone Number:</label>
        <input type="text" id="phoneNumber" value="7588686452">
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="passsword123443">
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testSimple()">Test Simple API</button>
    <button onclick="testLoginNoCookies()">Test Login (No Cookies)</button>
    
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing login...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Include cookies
                    body: JSON.stringify({
                        phoneNumber: parseInt(document.getElementById('phoneNumber').value),
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `Status: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = response.ok ? 'result success' : 'result error';
                
            } catch (error) {
                resultDiv.innerHTML = `Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
        
        async function testSimple() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing simple API...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('http://localhost:8000/test', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `Status: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = response.ok ? 'result success' : 'result error';
                
            } catch (error) {
                resultDiv.innerHTML = `Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
        
        async function testLoginNoCookies() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing login endpoint without cookies...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/user/test-login', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `Status: ${response.status}\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                resultDiv.className = response.ok ? 'result success' : 'result error';
                
            } catch (error) {
                resultDiv.innerHTML = `Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
